[project]
name = "second-voice-bank"
version = "0.1.0"
description = "Second Voice bank service: payer-side coercion hook and receiver-side mule band, one codebase, BANK_ID selects the role"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "google-cloud-firestore>=2.19",
  "google-genai>=1.0",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[tool.uv]
dev-dependencies = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
